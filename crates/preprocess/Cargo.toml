[package]
name = "relief-prep"
description = "Offline stage: downloads swissALTI3D and builds the dataset the viewer renders"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
png.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
relief-terrain.workspace = true

tiff = "0.9"
# Pure Rust readers for swissTLM3D's Shapefiles and the zip they come in.
shapefile = "0.9"
miniz_oxide = "0.8"
# The platform TLS stack keeps the build free of C dependencies.
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
