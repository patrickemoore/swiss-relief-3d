[package]
name = "relief-viewer"
description = "Real-time 3D terrain viewer with camera-relative Swiss-style relief shading"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
relief-terrain.workspace = true

glam = { version = "0.29", features = ["bytemuck", "serde"] }
half = "2"
log = "0.4"
wgpu = "24"

# The window, its panel and the offline tools exist only on the desktop; the
# browser build is the library alone.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true
png.workspace = true
rayon.workspace = true

egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false, features = ["clipboard"] }
env_logger = "0.11"
pollster = "0.4"
winit = "0.30"
