[package]
name = "relief-viewer"
description = "Desktop viewer for relief-render: a window with a lab panel, frame dumps and the offline evaluation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
png.workspace = true
rayon.workspace = true
serde_json.workspace = true
relief-terrain.workspace = true
relief-render = { path = "../render" }

egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false, features = ["clipboard"] }
env_logger = "0.11"
glam = { version = "0.29", features = ["bytemuck", "serde"] }
half = "2"
log = "0.4"
pollster = "0.4"
wgpu = "24"
winit = "0.30"
