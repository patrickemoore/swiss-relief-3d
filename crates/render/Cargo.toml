[package]
name = "relief-render"
description = "Camera-relative Swiss-style relief shading for 3D terrain: the renderer, the camera and the map labels, for the desktop and the browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
relief-terrain.workspace = true

glam = { version = "0.29", features = ["bytemuck", "serde"] }
half = "2"
log = "0.4"
wgpu = "24"

# Tiles are decoded on a thread pool and the GPU is opened synchronously on
# the desktop; in the browser both happen through the event loop.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
rayon.workspace = true
