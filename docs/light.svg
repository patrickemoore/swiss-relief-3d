<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8102e"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="920" height="360" rx="14" fill="#f7f5ef"/>

  <!-- Left panel: light fixed in the world -->
  <text x="40" y="38" font-size="16" font-weight="600" fill="#1c2026">Light fixed in the world</text>
  <text x="40" y="58" fill="#5b616b">A sun in the north-west, whatever the camera does</text>

  <!-- map from above -->
  <rect x="40" y="80" width="150" height="110" rx="4" fill="#ffffff" stroke="#b9b3a3"/>
  <text x="46" y="96" font-size="11" fill="#5b616b">from above</text>
  <line x1="56" y1="96" x2="98" y2="130" stroke="#c8102e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polygon points="100,130 150,120 160,170 110,178" fill="#d9d4c7"/>
  <polygon points="100,130 150,120 130,150" fill="#f2efe6"/>
  <polygon points="130,150 150,120 160,170 110,178" fill="#9b958a"/>
  <text x="40" y="208" font-size="11" fill="#5b616b">ridge reads well</text>

  <!-- same sun, camera turned around -->
  <rect x="220" y="80" width="190" height="110" rx="4" fill="#ffffff" stroke="#b9b3a3"/>
  <text x="226" y="96" font-size="11" fill="#5b616b">camera turned to face south</text>
  <line x1="315" y1="186" x2="315" y2="150" stroke="#c8102e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="322" y="182" font-size="11" fill="#c8102e">sun behind the viewer</text>
  <polygon points="250,110 380,110 395,150 235,150" fill="#eceae3"/>
  <polygon points="250,110 380,110 315,128" fill="#e8e5dc"/>
  <text x="220" y="208" font-size="11" fill="#5b616b">both flanks lit the same: flat</text>

  <text x="40" y="250" fill="#1c2026">Turn the camera, and the sun that made the map readable</text>
  <text x="40" y="270" fill="#1c2026">now lights every slope from the front or leaves it black.</text>

  <!-- Right panel: light fixed to the screen -->
  <line x1="460" y1="30" x2="460" y2="285" stroke="#d9d4c7"/>
  <text x="500" y="38" font-size="16" font-weight="600" fill="#1c2026">Light fixed to the screen</text>
  <text x="500" y="58" fill="#5b616b">Always from the top left of what you see</text>

  <!-- screen, straight down -->
  <rect x="500" y="80" width="150" height="110" rx="4" fill="#ffffff" stroke="#b9b3a3"/>
  <text x="506" y="96" font-size="11" fill="#5b616b">straight down</text>
  <line x1="516" y1="96" x2="558" y2="130" stroke="#c8102e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polygon points="560,130 610,120 620,170 570,178" fill="#d9d4c7"/>
  <polygon points="560,130 610,120 590,150" fill="#f2efe6"/>
  <polygon points="590,150 610,120 620,170 570,178" fill="#9b958a"/>
  <text x="500" y="208" font-size="11" fill="#5b616b">the classic map</text>

  <!-- screen, oblique, turned -->
  <rect x="680" y="80" width="190" height="110" rx="4" fill="#ffffff" stroke="#b9b3a3"/>
  <text x="686" y="96" font-size="11" fill="#5b616b">tilted and turned, any heading</text>
  <line x1="696" y1="96" x2="738" y2="130" stroke="#c8102e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polygon points="710,110 840,110 855,150 695,150" fill="#d9d4c7"/>
  <polygon points="710,110 840,110 775,128 695,150" fill="#f2efe6"/>
  <polygon points="775,128 840,110 855,150" fill="#9b958a"/>
  <text x="680" y="208" font-size="11" fill="#5b616b">still two flanks, two tones</text>

  <text x="500" y="250" fill="#1c2026">The light turns with the camera, with a lag so it never swims.</text>
  <text x="500" y="270" fill="#1c2026">Looking straight down is just the special case of the printed map.</text>

  <text x="40" y="322" font-size="12" fill="#5b616b">The same holds for the per-ridge light adjustments, the generalization and the haze: all are defined relative to the view.</text>
</svg>
