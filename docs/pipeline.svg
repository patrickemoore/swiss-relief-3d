<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="14" fill="#f7f5ef"/>

  <!-- Row labels -->
  <text x="24" y="52" font-size="11" fill="#8a8f98" font-weight="600" letter-spacing="1">OFFLINE, ONCE</text>
  <text x="24" y="262" font-size="11" fill="#8a8f98" font-weight="600" letter-spacing="1">EVERY FRAME</text>

  <!-- swissALTI3D -->
  <rect x="24" y="66" width="170" height="120" rx="8" fill="#ffffff" stroke="#b9b3a3"/>
  <text x="40" y="90" font-weight="600" fill="#1c2026">swissALTI3D</text>
  <text x="40" y="110" fill="#5b616b">43,627 GeoTIFFs at 2 m</text>
  <text x="40" y="128" fill="#5b616b">49 GB; only the 4 m</text>
  <text x="40" y="146" fill="#5b616b">overviews are fetched,</text>
  <text x="40" y="164" fill="#5b616b">10 GB by range request</text>

  <line x1="194" y1="126" x2="236" y2="126" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- relief-prep -->
  <rect x="238" y="66" width="230" height="120" rx="8" fill="#ffffff" stroke="#b9b3a3"/>
  <text x="254" y="90" font-weight="600" fill="#1c2026">relief-prep</text>
  <text x="254" y="110" fill="#5b616b">mosaic and resample to 10 m</text>
  <text x="254" y="128" fill="#5b616b">generalized pyramid, gradients</text>
  <text x="254" y="146" fill="#5b616b">landform orientation field</text>
  <text x="254" y="164" fill="#5b616b">lakes, elevation stats, colour table</text>

  <line x1="468" y1="126" x2="510" y2="126" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- dataset -->
  <rect x="512" y="66" width="200" height="120" rx="8" fill="#ffffff" stroke="#b9b3a3"/>
  <text x="528" y="90" font-weight="600" fill="#1c2026">Dataset</text>
  <text x="528" y="110" fill="#5b616b">655 km square of 10 m cells</text>
  <text x="528" y="128" fill="#5b616b">5 tiled levels, 9,578 tiles</text>
  <text x="528" y="146" fill="#5b616b">coarser levels whole</text>
  <text x="528" y="164" fill="#5b616b">3.7 GB on disk</text>

  <line x1="712" y1="126" x2="754" y2="126" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- packed -->
  <rect x="756" y="66" width="180" height="120" rx="8" fill="#ffffff" stroke="#b9b3a3"/>
  <text x="772" y="90" font-weight="600" fill="#1c2026">Packed for the web</text>
  <text x="772" y="110" fill="#5b616b">heights quantized to 5 cm,</text>
  <text x="772" y="128" fill="#5b616b">predicted, deflated</text>
  <text x="772" y="146" fill="#5b616b">520 MB of static files</text>
  <text x="772" y="164" fill="#5b616b">2.6 MB loaded up front</text>

  <!-- down arrows into the renderer -->
  <line x1="612" y1="186" x2="612" y2="236" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="620" y="214" fill="#5b616b">read from disk</text>
  <line x1="846" y1="186" x2="846" y2="236" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="854" y="214" fill="#5b616b">fetched</text>

  <!-- relief-render -->
  <rect x="238" y="238" width="698" height="112" rx="8" fill="#ffffff" stroke="#1c2026" stroke-width="1.5"/>
  <text x="254" y="262" font-weight="600" fill="#1c2026">relief-render</text>
  <text x="254" y="282" fill="#5b616b">streams a window of tiles per level around the camera</text>
  <text x="254" y="300" fill="#5b616b">screen-fixed light with lag · local light field per landform · multi-scale shading</text>
  <text x="254" y="318" fill="#5b616b">height fog, hypsometric tint, lakes · depth-edge halos · labels laid out per frame</text>
  <text x="254" y="338" fill="#5b616b">one Rust crate, built for the desktop and for WebAssembly</text>

  <!-- hosts -->
  <line x1="420" y1="350" x2="420" y2="378" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="300" y="380" width="240" height="36" rx="8" fill="#1c2026"/>
  <text x="420" y="403" text-anchor="middle" fill="#f7f5ef" font-weight="600">relief-viewer · desktop, winit + egui</text>

  <line x1="760" y1="350" x2="760" y2="378" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="620" y="380" width="300" height="36" rx="8" fill="#1c2026"/>
  <text x="770" y="403" text-anchor="middle" fill="#f7f5ef" font-weight="600">relief-web · wasm + WebGPU · React component</text>
</svg>
